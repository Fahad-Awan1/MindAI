<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>MindAI - Intelligent Study Companion</title>
    <meta name="description" content="Study smarter with an AI that knows your notes: cited chat, adaptive quizzes, spaced-repetition flashcards, study rooms and more." />
    <meta name="theme-color" content="#6d28d9" />
    <!-- Favicons: SVG for modern browsers, PNG/ICO fallbacks, iOS home screen, installable app manifest -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Fonts are self-hosted (bundled from @fontsource): no render-blocking stylesheet from another server -->
    <style>
      body {
        font-family: 'Inter Variable', 'Inter', system-ui, sans-serif;
        background-color: #f8fafc;
        -webkit-font-smoothing: antialiased;
      }
      /* Before the app mounts: brand background so there's no white flash before the splash screen */
      #root:empty { min-height: 100vh; background: #0b0a1a; }
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      
      .glass-dark {
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-right: 1px solid rgba(255, 255, 255, 0.05);
      }

      .break-inside-avoid {
          break-inside: avoid !important;
          page-break-inside: avoid !important;
      }
      
      .pdf-container {
          width: 100%;
          max-width: 100%;
          background: white;
      }

      @media print {
        @page { margin: 1cm; }
        body { 
            background: white; 
            color: black;
        }
        .no-print, 
        nav, 
        aside, 
        button,
        input,
        select,
        .tooltip-trigger,
        [role="tooltip"] {
            display: none !important;
        }
        .print-content {
            display: block !important;
            width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            box-shadow: none !important;
            border: none !important;
            overflow: visible !important;
        }
        
        tr, li, .break-inside-avoid {
            page-break-inside: avoid;
            break-inside: avoid;
        }
        
        #root { display: block !important; }
        main { margin: 0 !important; padding: 0 !important; height: auto !important; overflow: visible !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
