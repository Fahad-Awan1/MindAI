  <circle cx="17" cy="20" r="4.5" fill="#fff"/>
  <circle cx="47" cy="20" r="4.5" fill="#fff"/>
  <circle cx="47" cy="45" r="4.5" fill="#fff"/>
  <!-- The "spark" of insight -->
  <circle cx="32" cy="35" r="6" fill="#fbbf24" stroke="#fff" stroke-width="2.5"/>
