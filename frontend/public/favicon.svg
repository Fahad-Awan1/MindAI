<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>MindAI</title>
  <defs>
    <linearGradient id="mindai-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#mindai-bg)"/>
  <!-- An "M" drawn as a small neural network: five connected nodes -->
